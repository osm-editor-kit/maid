name: Pages

# Builds Maid apps and deploys them to GitHub Pages (tools/deploy/build-pages.ts). The apps and the path come from
# deploy.env, or from the repository variables MAID_APP and MAID_BASE when those are set. One app is served at the
# path; several are each served from a folder of their own, with a page of links at the path.
# The build does not contact OSM: the deployed app reads live data only when a person opens it, and saves only after
# that person logged in.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # no bunfig.toml in CI: the shared package store is for local machines
      - run: bun install --frozen-lockfile --config=/dev/null

      # one app at the path, or several apps each in a folder of its own with a page of links (tools/deploy)
      - name: Build the apps
        env:
          MAID_APP: ${{ vars.MAID_APP }}
          MAID_BASE: ${{ vars.MAID_BASE }}
          # OAuth client ids are not secrets; Maid is a public client (PKCE) and has no client secret
          VITE_OSM_CLIENT_ID: ${{ vars.OSM_CLIENT_ID }}
          VITE_OSM_DEV_CLIENT_ID: ${{ vars.OSM_DEV_CLIENT_ID }}
          VITE_MAPILLARY_TOKEN: ${{ vars.MAPILLARY_TOKEN }}
        run: bun run pages-build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
