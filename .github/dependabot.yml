# Schedule: open-source repos → first Thursday of the month, 07:00 Europe/Berlin.
version: 2
updates:
  - package-ecosystem: bun
    directories:
      - /
    schedule:
      interval: cron
      cronjob: '0 7 * * THU#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      security-dev-tools:
        applies-to: security-updates
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - '@playwright/*'
          - '@types/*'
          - 'typescript'
          - '@typescript/typescript-*'

      shared-monorepo-tools:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - '@types/bun'

      app-dev-minor-patch:
        applies-to: version-updates
        patterns:
          - '@playwright/*'
          - '@types/*'
          - 'oxfmt'
          - 'oxlint*'
          - 'typescript'
          - '@typescript/typescript-*'
        update-types:
          - minor
          - patch

      app-framework-minor-patch:
        applies-to: version-updates
        patterns:
          - 'maplibre-gl'
          - '@vis.gl/*'
          - 'react'
          - 'react-dom'
          - '@types/react*'
          - 'react-map-gl'
        update-types:
          - minor
          - patch

      app-prod-misc-patch:
        applies-to: version-updates
        update-types:
          - patch
        patterns:
          - '*'
        exclude-patterns:
          - 'maplibre-gl'
          - '@vis.gl/*'
          - 'react'
          - 'react-dom'
          - 'react-map-gl'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '0 7 * * THU#1'
      timezone: Europe/Berlin
    cooldown:
      default-days: 5
    open-pull-requests-limit: 1
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
        patterns:
          - '*'
