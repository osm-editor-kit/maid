<!doctype html>
<meta charset="utf-8" />
<title>MapLibre: a slow re-parse that finishes after a newer tile load overwrites it</title>
<link rel="stylesheet" href="/maplibre-gl/dist/maplibre-gl.css" />
<style>
  html,
  body,
  #map {
    height: 100%;
    margin: 0;
  }
  #out {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 1;
    background: #fff;
    padding: 8px;
    font: 13px/1.4 monospace;
    white-space: pre;
  }
</style>
<div id="map"></div>
<div id="out">running…</div>
<script type="module">
  // Local copy for our own runs. For an upstream report replace both URLs with a CDN build, e.g.
  // https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.mjs and .../maplibre-gl.css
  import { Map } from '/maplibre-gl/dist/maplibre-gl.mjs'

  // The sequence that goes wrong, made deterministic:
  //  1. A GeoJSON source holds many dashed lines. Its tiles are loaded.
  //  2. A paint property changes. MapLibre re-parses the loaded tiles. That re-parse has to ask
  //     the main thread for dash patterns, so it takes a round trip.
  //  3. Right after, the data is replaced by a few plain lines. Their tile needs no round trip
  //     and is answered first.
  //  4. The answer to the re-parse from step 2 arrives last and is applied on top: old buckets
  //     and old feature index, paired with the new raw tile data.
  const center = [13.4, 52.52]
  const map = new Map({
    container: 'map',
    center,
    zoom: 17,
    style: {
      version: 8,
      sources: {},
      layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#111' } }],
    },
  })

  let seed = 1
  const random = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646
  const line = (id, kind) => {
    const x = center[0] + (random() - 0.5) * 0.004
    const y = center[1] + (random() - 0.5) * 0.0025
    const coordinates = Array.from({ length: 6 }, (_, k) => [
      x + k * 0.0001 + random() * 0.00005,
      y + random() * 0.0002,
    ])
    return {
      type: 'Feature',
      properties: { id, kind },
      geometry: { type: 'LineString', coordinates },
    }
  }
  const sourceLoaded = () =>
    new Promise((resolve) => {
      const check = () => map.isSourceLoaded('lines') && (map.off('sourcedata', check), resolve())
      map.on('sourcedata', check)
      check()
    })

  map.on('load', async () => {
    map.addSource('lines', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features: [] },
      promoteId: 'id',
    })
    map.addLayer({
      id: 'dashed',
      type: 'line',
      source: 'lines',
      filter: ['==', ['get', 'kind'], 'dashed'],
      paint: {
        'line-color': '#f66',
        'line-width': 2,
        'line-dasharray': [
          'match',
          ['get', 'kind'],
          'dashed',
          ['literal', [2, 2]],
          ['literal', [1, 0]],
        ],
      },
    })
    map.addLayer({
      id: 'plain',
      type: 'line',
      source: 'lines',
      filter: ['==', ['get', 'kind'], 'plain'],
      paint: { 'line-color': '#6f6', 'line-width': 2 },
    })
    const source = map.getSource('lines')
    // Diagnostics: do answers for the same tile come back in a different order than they were asked?
    const trace = { requests: 0, overlapping: 0, outOfOrder: 0 }
    const open = new globalThis.Map()
    const loadTile = source.loadTile.bind(source)
    source.loadTile = async (tile) => {
      const n = ++trace.requests
      const pending = open.get(tile.uid) ?? []
      if (pending.length) trace.overlapping++
      open.set(tile.uid, [...pending, n])
      try {
        return await loadTile(tile)
      } finally {
        const list = open.get(tile.uid)
        // an older request for this tile is still open: this answer overtook it
        if (list.some((m) => m < n)) trace.outOfOrder++
        open.set(
          tile.uid,
          list.filter((m) => m !== n),
        )
      }
    }

    // 1. many dashed lines, fully loaded
    await source.updateData({
      add: Array.from({ length: 4000 }, (_, i) => line(`old-${i}`, 'dashed')),
    })
    await sourceLoaded()
    await map.once('idle')

    // 2. style change: re-parse of the loaded tiles, needs a round trip for the new dash pattern
    map.setPaintProperty('dashed', 'line-dasharray', [
      'match',
      ['get', 'kind'],
      'dashed',
      ['literal', [3, 1]],
      ['literal', [1, 0]],
    ])
    // let MapLibre send the re-parse request; it does so on the next frame
    await new Promise((resolve) => requestAnimationFrame(resolve))
    // 3. replace the data by a few plain lines
    const fresh = Array.from({ length: 5 }, (_, i) => line(`new-${i}`, 'plain'))
    await source.updateData({ removeAll: true, add: fresh })
    await sourceLoaded()
    await new Promise((resolve) => {
      map.once('idle', resolve)
      map.triggerRepaint()
    })
    await new Promise((resolve) => setTimeout(resolve, 500))

    const inTiles = [...new Set(map.querySourceFeatures('lines').map((f) => f.id))]
    let rendered
    try {
      rendered = [
        ...new Set(map.queryRenderedFeatures({ layers: ['dashed', 'plain'] }).map((f) => f.id)),
      ].length
    } catch (error) {
      rendered = String(error)
    }
    const result = {
      version: map.version,
      mode: 'ordered sequence',
      expectedInTiles: 5,
      inWorkerData: (await source.getData()).features.length,
      inTiles_querySourceFeatures: inTiles.length,
      staleFeaturesInTiles: inTiles.filter((id) => String(id).startsWith('old-')).length,
      queryRenderedFeatures: rendered,
      ...trace,
      ok: inTiles.length === 5 && rendered === 5,
    }
    document.getElementById('out').textContent = JSON.stringify(result, null, 2)
    window.__result = result
  })
</script>
