<!DOCTYPE html>
<!--
  Host page for the iD reference (pinned in pin.json, built by setup.ts, served by serve.ts).

    /?scene=small|medium|dense   scene from the mock OSM API (default: small)
    /?build=dev                  load dist/iD.js instead of dist/iD.min.js
    /?cull=0                     iD draws all points and buildings instead of auto-hiding them
    /?validation=1               keep iD's validator running (off by default, see NOTES.md "Validation and background work")
    #map=17/52.389/13.4          iD's own hash; defaults to the scene's center and zoom (tools/fixtures/scenes.ts)

  Modelled on iD's own index.html. Differences, all to keep iD away from the network
  (AGENTS.md core rule 1) and to keep the map free of dialogs; rendering is left at iD's defaults:
    - OSM connection is switched to the mock API before context.init()
    - background=none, and the imagery index is primed empty (no Bing metadata, no locator overlay)
    - services are removed (taginfo, nominatim, nsi, photo layers, QA) or answer "offline" (wikidata, wikipedia, OSM wiki)
    - localStorage is reset on every load, splash screen marked as seen
    - the sidebar is collapsed (adapter.js), so the map fills the viewport
-->
<html>
  <head>
    <meta charset='utf-8'>
    <title>iD reference</title>
    <link rel='stylesheet' href='dist/iD.css'>
    <link rel='icon' type='image/png' href='data:image/png;base64,iVBORw0KGgo='>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no'/>
    <style type='text/css'>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id='id-container'></div>

    <script src='bench-config.js'></script>
    <script src='adapter.js'></script>
    <script src="/frame-sync.js"></script>
    <script>
      (function () {
        var config = window.__BENCH_CONFIG;
        var container = document.getElementById('id-container');
        var params = new URLSearchParams(window.location.search);
        var sceneName = params.get('scene') || 'small';
        var scene = config.scenes.find(function (s) { return s.name === sceneName; });

        function fail(message) {
          container.textContent = message;
          container.style.padding = '20px';
          window.__benchFail(new Error(message));
        }

        if (!scene) {
          return fail('Unknown scene "' + sceneName + '". Known: ' + config.scenes.map(function (s) { return s.name; }).join(', '));
        }
        var apiRoot = config.mockApi + '/s/' + scene.name;

        // Same state on every load: no restored history, no remembered location or background.
        try {
          window.localStorage.clear();
          window.localStorage.setItem('sawSplash', 'true');   // modules/ui/splash.js
        } catch (e) { /* storage disabled: iD falls back to memory, the splash is closed below */ }

        // iD reads these from the hash during init (behavior/hash.js, renderer/background.js).
        var hash = {};
        window.location.hash.replace(/^#/, '').split('&').forEach(function (pair) {
          var i = pair.indexOf('=');
          if (i > 0) hash[pair.slice(0, i)] = pair.slice(i + 1);
        });
        if (!hash.map) hash.map = (scene.zoom || 17) + '/' + scene.center[1] + '/' + scene.center[0];
        hash.background = 'none';
        delete hash.walkthrough;
        delete hash.overlays;
        delete hash.gpx;
        delete hash.photo_overlay;
        window.history.replaceState(null, '', window.location.pathname + window.location.search + '#' +
          Object.keys(hash).map(function (k) { return k + '=' + hash[k]; }).join('&'));

        var script = document.createElement('script');
        script.onload = start;
        script.onerror = function () { fail('Could not load the iD bundle. Run: bun tools/refs/id/setup.ts'); };
        script.src = params.get('build') === 'dev' ? 'dist/iD.js' : 'dist/iD.min.js';
        document.head.appendChild(script);

        function start() {
          if (typeof iD === 'undefined' || !iD.utilDetect().support) return fail('iD does not support this browser.');
          try {
            // No imagery sources at all. iD still adds its built-in "none" and "custom" sources.
            // Without this iD loads data/imagery.min.json, asks Bing for metadata and switches
            // on the default locator overlay (renderer/background.js:445-491).
            iD.fileFetcher.cache().imagery = [];
            // Language list for the wikipedia field, normally fetched from jsDelivr when a selected
            // feature shows that field. Empty: nothing to fetch.
            iD.fileFetcher.cache().wmf_sitematrix = [];

            // Remove every service iD can live without; it guards their use with `if (services.x)`.
            // Goes: taginfo (requests popular keys on init), geocoder (Nominatim), nsi (downloads
            // several MB on init), osmose (QA), vectorTile, maprules and all street-level photo services.
            var KEEP = ['osm', 'wikidata', 'wikipedia', 'osmWikibase'];
            Object.keys(iD.services).forEach(function (key) {
              if (KEEP.indexOf(key) === -1) delete iD.services[key];
            });
            // The wiki services are used unguarded by the preset fields in the sidebar
            // (ui/fields/wikidata.js:189 throws without them when a selected feature has a
            // wikidata field), so they stay, but every method that fetches answers "offline".
            // Hosts this keeps away: www.wikidata.org, *.wikipedia.org, wiki.openstreetmap.org.
            var offline = function () {
              for (var i = 0; i < arguments.length; i++) {
                if (typeof arguments[i] === 'function') return void arguments[i](new Error('offline (maid bench)'));
              }
            };
            var FETCHING = {
              wikidata: ['itemsForSearchQuery', 'itemsByTitle', 'entityByQID', 'getDocs'],
              wikipedia: ['search', 'suggestions'],
              osmWikibase: ['getEntity', 'getDocs']
            };
            Object.keys(FETCHING).forEach(function (key) {
              FETCHING[key].forEach(function (method) {
                if (typeof iD.services[key][method] !== 'function') throw new Error('iD.services.' + key + '.' + method + ' is gone, update index.html');
                iD.services[key][method] = offline;
              });
            });

            var context = iD.coreContext()
              .assetPath('dist/')
              .containerNode(container);
            window.context = window.id = context;  // for debugging, as upstream does

            try { window.localStorage.setItem('sawPrivacyVersion', context.privacyVersion); } catch (e) { /* see above */ }

            // Point the connection at the scene BEFORE init, so the first request iD makes
            // already goes to the mock API. The bundle default is the mock API too (setup.ts).
            // The client id is a dummy, nothing can sign in.
            var connection = { url: apiRoot, apiUrl: apiRoot, client_id: 'maid-bench-no-auth' };
            context.connection().apiConnections([connection]);   // one entry: no source switcher in the UI
            context.preauth(connection);                          // = services.osm.switch()

            context.locale('en');   // UI language only; keeps runs identical across machines
            context.init();

            // Validation is off by default. Maid has no validator, and iD's runs in idle time after
            // every merged tile (merge.validator), on every mode change and after every edit, which
            // is work that does not draw. Switched off here, before any data arrives (data comes
            // from requestIdleCallback after this script; context.ts:300). Removing the listeners
            // stops the automatic runs; replacing validate() covers the explicit calls from the UI
            // and modes (modes/select.js, operations/*, ui/entity_editor.js). getIssues() then
            // stays empty. ?validation=1 keeps iD's validator as it is.
            if (params.get('validation') !== '1') {
              var idHistory = context.history();
              idHistory.on('merge.validator', null);    // validator.js:563
              idHistory.on('restore.validator', null);  // validator.js:550
              idHistory.on('undone.validator', null);   // validator.js:551
              idHistory.on('redone.validator', null);   // validator.js:552
              idHistory.on('reset.validator', null);    // validator.js:553
              context.on('exit.validator', null);       // validator.js:561
              context.validator().validate = function () { return Promise.resolve(); };  // validator.js:470
            }

            // as upstream index.html: boundaries are off unless the hash says otherwise
            if (!hash.disable_features) context.features().disable('boundaries');

            // ?cull=0: switch off iD's automatic hiding of points, address points and buildings
            // (renderer/features.js:101-129: max 100 / 200 / 250 per 1000x1000 px). Uses iD's own
            // rule objects: with max = Infinity `rule.hidden()` is never true for an enabled rule,
            // so iD draws them all and features.hidden()/autoHidden() (= stats().hidden) stay truthful.
            // Opt-in, for like-for-like workload runs. The default keeps iD's behaviour.
            var cull = params.get('cull') !== '0';
            if (!cull) {
              var rules = context.features().features();
              ['address_points', 'points', 'buildings'].forEach(function (key) {
                if (!rules[key] || !isFinite(rules[key].defaultMax)) throw new Error('feature rule "' + key + '" has no max any more, update index.html');
                rules[key].defaultMax = Infinity;
                rules[key].currentMax = Infinity;
              });
            }
            window.__BENCH_CONFIG.cull = cull;

            window.__benchInstall(iD, context);
          } catch (error) {
            fail('iD failed to start: ' + (error && error.message || error));
            throw error;
          }
        }
      })();
    </script>
  </body>
</html>
