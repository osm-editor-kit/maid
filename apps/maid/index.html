<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maid</title>
    <style>
      /* shown from the first byte until the editor's code has loaded and React replaces #root's content (mount.tsx) */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #18181b;
        }
      }
      .boot {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
      .boot::after {
        content: '';
        width: 2rem;
        height: 2rem;
        border: 3px solid rgb(113 113 122 / 0.3);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot::after {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"></div></div>
    <script src="/frame-sync.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
